<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe6d4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Покупки">
  <link rel="manifest" href="https://dmitryrt.github.io/pokupki/manifest.webmanifest">
  <link rel="shortcut icon" href="https://dmitryrt.github.io/pokupki/favicon.ico">
  <link rel="icon" href="https://dmitryrt.github.io/pokupki/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="https://dmitryrt.github.io/pokupki/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://dmitryrt.github.io/pokupki/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="https://dmitryrt.github.io/pokupki/icon-512.png">
  <link rel="apple-touch-icon" href="https://dmitryrt.github.io/pokupki/apple-touch-icon-v2.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://dmitryrt.github.io/pokupki/apple-touch-icon-v2.png">
  <link rel="apple-touch-icon-precomposed" href="https://dmitryrt.github.io/pokupki/apple-touch-icon-precomposed.png">
  <title>Покупки</title>
  <style>
    :root {
      --bg: #efe6d4;
      --paper: #fbf6eb;
      --ink: #2c241b;
      --muted: #7a6d5c;
      --line: #e2d6c2;
      --accent: #3f6b52;
      --accent-soft: #dce8e0;
      --danger: #9a4a3c;
      --shadow: 0 10px 30px rgba(44, 36, 27, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #f7f0e2 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100%;
      padding: max(16px, env(safe-area-inset-top)) 16px 32px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bag {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--accent-soft);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .subtitle {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    button, .icon-btn {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 14px;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
    }

    .icon-btn:active { transform: scale(0.97); }

    .icon-btn.clear-btn svg {
      stroke: var(--danger);
    }

    .sheet {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px;
    }

    form.add {
      display: flex;
      gap: 8px;
    }

    form.add input {
      flex: 1;
      min-width: 0;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 14px;
      font-size: 16px;
      background: #fffdf8;
      color: var(--ink);
      outline: none;
    }

    form.add input:focus {
      border-color: var(--accent);
    }

    .add-btn {
      height: 52px;
      padding: 0 16px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #f7fbf8;
      font-weight: 650;
      white-space: nowrap;
    }

    .hint {
      margin: 14px 4px 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .list {
      list-style: none;
      margin: 14px 0 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr 36px;
      align-items: center;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fffdf8;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    .item.editing {
      opacity: 1;
    }

    .item-main {
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 10px 4px 10px 12px;
      border: 0;
      background: transparent;
      text-align: left;
      width: 100%;
    }

    .item .mark {
      width: 24px;
      height: 24px;
      border: 2px solid var(--accent);
      border-radius: 8px;
      display: grid;
      place-items: center;
    }

    .item .text {
      font-size: 1.05rem;
      line-height: 1.3;
      word-break: break-word;
    }

    .item .edit-input {
      width: 100%;
      min-width: 0;
      height: 36px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 0 10px;
      font: inherit;
      font-size: 1.05rem;
      background: #fff;
      color: var(--ink);
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .item .remove {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 1.3rem;
      line-height: 1;
    }

    .done-wrap {
      margin-top: 22px;
    }

    .done-wrap h2 {
      margin: 0 0 10px 6px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .item.done {
      opacity: 0.36;
      background: transparent;
      box-shadow: none;
    }

    .item.done.editing {
      opacity: 1;
    }

    .item.done .mark {
      background: var(--accent);
      border-color: var(--accent);
    }

    .item.done .mark::after {
      content: "";
      width: 6px;
      height: 11px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .item.done .text {
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    .count {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 10px 6px 0;
    }

    .bag {
      font-size: 1.35rem;
      line-height: 1;
    }

    dialog {
      width: min(420px, calc(100% - 24px));
      max-height: min(90vh, 720px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 24px 60px rgba(44, 36, 27, 0.22);
    }

    dialog::backdrop {
      background: rgba(44, 36, 27, 0.35);
    }

    .dialog-body {
      padding: 18px 16px 16px;
    }

    .dialog-body h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }

    .dialog-body p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      font: inherit;
      font-size: 16px;
      background: #fffdf8;
      color: var(--ink);
    }

    .row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .row button, .ghost {
      flex: 1;
      min-height: 46px;
      height: auto;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fffdf8;
      font-weight: 650;
    }

    .row button.primary, .primary {
      background: var(--accent);
      color: #f7fbf8;
      border-color: var(--accent);
    }

    .danger {
      color: var(--danger);
    }

    .qr {
      margin-top: 14px;
      padding: 12px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid var(--line);
    }

    .qr svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .qr-note {
      margin: 8px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(120%);
      background: var(--ink);
      color: #fbf6eb;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.92rem;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s ease;
      z-index: 20;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="bag" aria-hidden="true">🛒</div>
        <div>
          <h1>Покупки</h1>
          <p class="subtitle" id="subtitle">Список на этот раз</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="notify-btn" title="Пора за покупками" aria-label="Пора за покупками">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2c241b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="5" r="2.2"/>
            <path d="M10 9.2v6"/>
            <path d="m7.2 22 2.8-6.8 2.6 6.8"/>
            <path d="M12.2 12.2 16 8.4"/>
            <path d="M16 6.2v2.8"/>
          </svg>
        </button>
        <button class="icon-btn" id="share-btn" title="Отправить" aria-label="Отправить список">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2c241b" stroke-width="1.8">
            <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/>
            <path d="M12 4v12"/>
            <path d="M8 8l4-4 4 4"/>
          </svg>
        </button>
        <button class="icon-btn clear-btn" id="clear-btn" title="Новый список" aria-label="Новый список">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
            <path d="M6 6l12 12"/>
            <path d="M18 6L6 18"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="sheet">
      <form class="add" id="add-form">
        <input id="item-input" type="text" maxlength="80" placeholder="Что купить?" autocomplete="off" enterkeyhint="done">
        <button class="add-btn" type="submit">Добавить</button>
      </form>
      <p class="hint hidden" id="empty">
        Список пока пуст. Это общий список: что добавите — появится у всех, у кого открыта эта ссылка. Нажмите «Отправить», чтобы её переслать.
      </p>
      <ul class="list" id="active-list"></ul>
      <p class="count" id="count"></p>
    </div>

    <section class="done-wrap hidden" id="done-wrap">
      <h2>В корзине</h2>
      <ul class="list" id="done-list"></ul>
    </section>
  </div>

  <dialog id="share-dialog">
    <div class="dialog-body">
      <h2>Отправить список</h2>
      <p>Одна ссылка на двоих. Добавьте её на экран телефона — список будет общим.</p>
      <textarea id="share-text" readonly></textarea>
      <div class="row">
        <button type="button" class="primary" id="copy-btn">Копировать ссылку</button>
        <button type="button" id="native-share-btn">Отправить</button>
      </div>
      <div class="qr" id="qr-box"></div>
      <p class="qr-note" id="qr-note"></p>
      <div class="row">
        <button type="button" class="ghost" id="close-share">Закрыть</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast"></div>

  <script>
    (() => {
      const STORAGE_KEY = "pokupki.v2";
      const FAMILY_ID = "pokupki01";
      const PHONE_KEY = "pokupki.notifyPhone";
      const firebaseConfig = {
        apiKey: "AIzaSyBVX9TB3LBxOzKDBNYGy3MZogdRmzMKCyE",
        authDomain: "pokupki-dd5a5.firebaseapp.com",
        databaseURL: "https://pokupki-dd5a5-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "pokupki-dd5a5",
        storageBucket: "pokupki-dd5a5.firebasestorage.app",
        messagingSenderId: "941739986569",
        appId: "1:941739986569:web:5291319f1e2fe105b18058"
      };
      const form = document.getElementById("add-form");
      const input = document.getElementById("item-input");
      const activeList = document.getElementById("active-list");
      const doneList = document.getElementById("done-list");
      const doneWrap = document.getElementById("done-wrap");
      const empty = document.getElementById("empty");
      const count = document.getElementById("count");
      const subtitle = document.getElementById("subtitle");
      const toastEl = document.getElementById("toast");
      const shareDialog = document.getElementById("share-dialog");
      const shareText = document.getElementById("share-text");
      const qrBox = document.getElementById("qr-box");
      const qrNote = document.getElementById("qr-note");
      const nativeShareBtn = document.getElementById("native-share-btn");

      let items = [];
      let listId = "";
      let toastTimer = 0;
      let skipCloud = false;
      let cloudReady = false;
      let editingId = null;
      let editingDraft = "";

      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const newListId = () => {
        const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
        let id = "";
        const bytes = new Uint8Array(12);
        crypto.getRandomValues(bytes);
        bytes.forEach((byte) => { id += chars[byte % chars.length]; });
        return id;
      };

      function firebaseConfigured() {
        return Boolean(firebaseConfig.apiKey && firebaseConfig.databaseURL && firebaseConfig.projectId);
      }

      function itemsRef() {
        return firebase.database().ref(`lists/${listId}/items`);
      }

      function loadStored() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || {};
        } catch {
          return {};
        }
      }

      function idFromUrl() {
        const queryId = new URLSearchParams(location.search).get("l");
        if (queryId && /^[A-Za-z0-9_-]{8,32}$/.test(queryId)) return queryId;
        const hashId = location.hash.match(/[#&]l=([A-Za-z0-9_-]{8,32})/);
        return hashId ? hashId[1] : "";
      }

      function setUrl() {
        if (!listId) return location.href;
        const url = new URL(location.href);
        url.searchParams.set("l", listId);
        url.hash = "";
        const next = `${url.pathname}?${url.searchParams.toString()}`;
        history.replaceState(null, "", next);
        return `${url.origin}${next}`;
      }

      function shareUrl() {
        return setUrl();
      }

      function persistLocal() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ listId, items }));
        setUrl();
      }

      function itemsToMap() {
        const map = {};
        items.forEach((item) => {
          map[item.id] = {
            text: item.text,
            done: !!item.done,
            created: item.created || Date.now()
          };
        });
        return map;
      }

      function mapToItems(value) {
        return Object.entries(value || {})
          .map(([id, data]) => ({
            id,
            text: (data && data.text) || "",
            done: !!(data && data.done),
            created: (data && data.created) || 0
          }))
          .filter((item) => item.text)
          .sort((a, b) => (b.created || 0) - (a.created || 0));
      }

      function cloudError(error) {
        console.error(error);
        toast("Облако не приняло список — проверьте Rules в Firebase");
      }

      function writeItem(item) {
        if (!cloudReady || skipCloud || !listId) return;
        itemsRef().child(item.id).set({
          text: item.text,
          done: !!item.done,
          created: item.created || Date.now()
        }).catch(cloudError);
      }

      function save() {
        persistLocal();
      }

      function applyCloud(value) {
        skipCloud = true;
        items = mapToItems(value);
        persistLocal();
        render();
        skipCloud = false;
      }

      function toast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
      }

      function exportText() {
        const lines = items.map((item) => `${item.done ? "[x]" : "[ ]"} ${item.text}`);
        return ["Покупки", ...lines].join("\n");
      }

      function itemButton(item, done) {
        const li = document.createElement("li");
        const row = document.createElement("div");
        row.className = "item" + (done ? " done" : "");
        row.dataset.itemId = item.id;
        row.innerHTML = `
          <button class="item-main" type="button">
            <span class="mark" aria-hidden="true"></span>
            <span class="text"></span>
          </button>
          <button class="remove" type="button" aria-label="Удалить">×</button>
        `;
        const main = row.querySelector(".item-main");
        row.querySelector(".text").textContent = item.text;
        main.setAttribute("aria-label", done ? `Вернуть: ${item.text}` : `В корзину: ${item.text}`);

        let pressTimer = 0;
        let startX = 0;
        let startY = 0;
        let suppressClick = false;

        const clearPress = () => {
          clearTimeout(pressTimer);
          pressTimer = 0;
        };

        main.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "mouse" && event.button !== 0) return;
          suppressClick = false;
          startX = event.clientX;
          startY = event.clientY;
          clearPress();
          pressTimer = setTimeout(() => {
            pressTimer = 0;
            suppressClick = true;
          }, 500);
        });
        main.addEventListener("pointermove", (event) => {
          if (!pressTimer) return;
          if (Math.hypot(event.clientX - startX, event.clientY - startY) > 10) clearPress();
        });
        main.addEventListener("pointerup", () => {
          const ready = suppressClick;
          clearPress();
          if (ready) startEdit(item.id);
        });
        main.addEventListener("pointercancel", clearPress);
        main.addEventListener("click", (event) => {
          if (suppressClick || editingId === item.id) {
            event.preventDefault();
            suppressClick = false;
            return;
          }
          toggle(item.id);
        });
        main.addEventListener("contextmenu", (event) => event.preventDefault());
        row.querySelector(".remove").addEventListener("click", () => remove(item.id));
        li.appendChild(row);
        return li;
      }

      function mountEditInput(item) {
        const row = document.querySelector(`[data-item-id="${item.id}"]`);
        if (!row) return;
        const textEl = row.querySelector(".text");
        if (!textEl || row.querySelector(".edit-input")) return;
        row.classList.add("editing");
        const field = document.createElement("input");
        field.className = "edit-input";
        field.type = "text";
        field.maxLength = 80;
        field.value = editingDraft || item.text;
        field.setAttribute("aria-label", "Изменить покупку");
        field.setAttribute("enterkeyhint", "done");
        textEl.replaceWith(field);
        field.addEventListener("input", () => { editingDraft = field.value; });
        field.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            field.blur();
          }
          if (event.key === "Escape") {
            event.preventDefault();
            cancelEdit();
          }
        });
        field.addEventListener("blur", () => {
          if (!field.isConnected) return;
          commitEdit(item.id, field.value);
        });
        requestAnimationFrame(() => {
          field.focus();
          field.setSelectionRange(0, field.value.length);
        });
      }

      function startEdit(id) {
        const item = items.find((entry) => entry.id === id);
        if (!item) return;
        if (editingId && editingId !== id) commitEdit(editingId, editingDraft);
        editingId = id;
        editingDraft = item.text;
        mountEditInput(item);
      }

      function cancelEdit() {
        editingId = null;
        editingDraft = "";
        render();
      }

      function commitEdit(id, text) {
        if (editingId !== id) return;
        const value = String(text || "").trim();
        const item = items.find((entry) => entry.id === id);
        editingId = null;
        editingDraft = "";
        if (!item || !value || item.text === value) {
          render();
          return;
        }
        item.text = value;
        persistLocal();
        render();
        writeItem(item);
      }

      function render() {
        const active = items.filter((item) => !item.done);
        const done = items.filter((item) => item.done);
        activeList.replaceChildren(...active.map((item) => itemButton(item, false)));
        doneList.replaceChildren(...done.map((item) => itemButton(item, true)));
        empty.classList.toggle("hidden", items.length > 0);
        doneWrap.classList.toggle("hidden", done.length === 0);
        const left = active.length;
        count.textContent = items.length
          ? (left ? `Осталось ${left}` : "Всё в корзине")
          : "";
        subtitle.textContent = left ? `${left} в списке` : (items.length ? "Можно идти на кассу" : "Список на этот раз");
        if (editingId) {
          const item = items.find((entry) => entry.id === editingId);
          if (item) mountEditInput(item);
          else {
            editingId = null;
            editingDraft = "";
          }
        }
      }

      function addItem(text) {
        const value = text.trim();
        if (!value) return;
        const item = { id: uid(), text: value, done: false, created: Date.now() };
        items.unshift(item);
        persistLocal();
        render();
        writeItem(item);
      }

      function toggle(id) {
        items = items.map((item) => item.id === id ? { ...item, done: !item.done } : item);
        persistLocal();
        render();
        const item = items.find((entry) => entry.id === id);
        if (item) writeItem(item);
      }

      function remove(id) {
        if (editingId === id) {
          editingId = null;
          editingDraft = "";
        }
        items = items.filter((item) => item.id !== id);
        persistLocal();
        render();
        if (!cloudReady || skipCloud || !listId) return;
        itemsRef().child(id).remove().catch(cloudError);
      }

      function renderQr(text) {
        qrBox.innerHTML = "";
        qrNote.textContent = "";
        if (typeof qrcode !== "function") {
          qrNote.textContent = "QR недоступен — отправьте текстом.";
          return;
        }
        try {
          qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
          const qr = qrcode(0, "M");
          qr.addData(text, "Byte");
          qr.make();
          qrBox.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
          qrNote.textContent = "Если вы рядом — пусть отсканирует этот код.";
        } catch {
          qrNote.textContent = "Список длинный для QR — отправьте текстом.";
        }
      }

      function openShare() {
        const url = shareUrl();
        shareText.value = url;
        renderQr(url);
        nativeShareBtn.classList.toggle("hidden", typeof navigator.share !== "function");
        shareDialog.showModal();
        shareText.focus();
        shareText.select();
      }

      async function copyText() {
        const text = shareText.value;
        try {
          await navigator.clipboard.writeText(text);
          toast("Ссылка скопирована");
        } catch {
          shareText.select();
          const ok = document.execCommand("copy");
          toast(ok ? "Ссылка скопирована" : "Выделите ссылку и скопируйте");
        }
      }

      async function nativeShare() {
        const url = shareText.value;
        try {
          await navigator.share({ title: "Покупки", text: url });
        } catch (error) {
          if (error?.name !== "AbortError") copyText();
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        addItem(input.value);
        input.value = "";
        input.focus();
      });

      function clearList() {
        if (items.length && !confirm("Очистить список?")) return;
        editingId = null;
        editingDraft = "";
        items = [];
        persistLocal();
        render();
        if (cloudReady && listId) itemsRef().remove().catch(cloudError);
      }

      function readPhone() {
        try {
          return localStorage.getItem(PHONE_KEY) || "";
        } catch {
          return "";
        }
      }

      function savePhone(phone) {
        localStorage.setItem(PHONE_KEY, phone);
      }

      function normalizePhone(raw) {
        let digits = String(raw || "").replace(/[^\d+]/g, "");
        if (digits.startsWith("00")) digits = "+" + digits.slice(2);
        if (digits.startsWith("8") && digits.length === 11) digits = "+7" + digits.slice(1);
        else if (digits.startsWith("7") && digits.length === 11) digits = "+" + digits;
        else if (/^\d{10}$/.test(digits)) digits = "+7" + digits;
        if (!/^\+\d{10,15}$/.test(digits)) return "";
        return digits;
      }

      function askPhone(existing) {
        const typed = window.prompt(
          existing ? "Новый номер, кому писать «Пора за покупками»" : "Номер, кому написать «Пора за покупками»",
          existing || "+7"
        );
        if (typed == null) return "";
        const phone = normalizePhone(typed);
        if (!phone) {
          toast("Не похоже на номер телефона");
          return "";
        }
        savePhone(phone);
        return phone;
      }

      function openSms(phone) {
        const body = encodeURIComponent("Пора за покупками");
        const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        const href = ios ? `sms:${phone}&body=${body}` : `sms:${phone}?body=${body}`;
        window.location.href = href;
      }

      function notifyShop() {
        const saved = readPhone();
        const phone = saved || askPhone("");
        if (!phone) return;
        openSms(phone);
      }

      function bindNotifyButton() {
        const button = document.getElementById("notify-btn");
        let pressTimer = 0;
        let startX = 0;
        let startY = 0;
        let suppressClick = false;
        const clearPress = () => {
          clearTimeout(pressTimer);
          pressTimer = 0;
        };
        button.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "mouse" && event.button !== 0) return;
          suppressClick = false;
          startX = event.clientX;
          startY = event.clientY;
          clearPress();
          pressTimer = setTimeout(() => {
            pressTimer = 0;
            suppressClick = true;
          }, 500);
        });
        button.addEventListener("pointermove", (event) => {
          if (!pressTimer) return;
          if (Math.hypot(event.clientX - startX, event.clientY - startY) > 10) clearPress();
        });
        button.addEventListener("pointerup", () => {
          const ready = suppressClick;
          clearPress();
          if (ready) {
            const phone = askPhone(readPhone());
            if (phone) toast("Номер сохранён на этом телефоне");
          }
        });
        button.addEventListener("pointercancel", clearPress);
        button.addEventListener("click", (event) => {
          if (suppressClick) {
            event.preventDefault();
            suppressClick = false;
            return;
          }
          notifyShop();
        });
        button.addEventListener("contextmenu", (event) => event.preventDefault());
      }

      document.getElementById("share-btn").addEventListener("click", openShare);
      bindNotifyButton();
      document.getElementById("close-share").addEventListener("click", () => shareDialog.close());
      document.getElementById("copy-btn").addEventListener("click", copyText);
      nativeShareBtn.addEventListener("click", nativeShare);
      document.getElementById("clear-btn").addEventListener("click", clearList);

      function connectList(id) {
        if (listId && cloudReady) itemsRef().off();
        listId = id;
        persistLocal();
        render();
        if (!cloudReady) return;
        itemsRef().on("value", (snap) => {
          const value = snap.val();
          if (value == null) {
            if (items.length) itemsRef().update(itemsToMap()).catch(cloudError);
            return;
          }
          const cloudItems = mapToItems(value);
          const cloudTexts = new Set(cloudItems.map((item) => item.text.trim().toLowerCase()));
          items.forEach((item) => {
            if (!cloudTexts.has(item.text.trim().toLowerCase())) writeItem(item);
          });
          applyCloud(value);
        }, (error) => {
          toast("Нет доступа к облаку — откройте Rules в Firebase");
          console.error(error);
        });
      }

      if (!firebaseConfigured()) {
        toast("Сначала вставьте ключи Firebase");
      } else {
        try {
          firebase.initializeApp(firebaseConfig);
          cloudReady = true;
        } catch (error) {
          console.error(error);
          toast("Firebase не подключился");
        }
      }

      const stored = loadStored();
      items = Array.isArray(stored.items) ? stored.items : [];
      connectList(FAMILY_ID);
      window.addEventListener("popstate", () => {
        const next = idFromUrl();
        if (next && next !== listId) connectList(next);
      });
      input.focus();
    })();
  </script>
</body>
</html>
